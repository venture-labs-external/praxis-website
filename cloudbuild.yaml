# Switched from $commit_SHA to $SHORT_SHA

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      [
        "-c",
        "docker build -t eu.gcr.io/$PROJECT_ID/dev-praxis-website-nuxtapp:$SHORT_SHA . --build-arg BASE_URL=https://praxis-website.venturelabs.team",
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'eu.gcr.io/$PROJECT_ID/dev-praxis-website-nuxtapp:$SHORT_SHA'

  # [START cloudbuild-trigger-cd]
  # This step clones the hello-cloudbuild-env repository
  - name: 'gcr.io/cloud-builders/gcloud'
    id: Clone env repository
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
        gcloud source repos clone dev-server-env && \
        cd dev-server-env && \
        git checkout candidate && \
        git config user.email $(gcloud auth list --filter=status:ACTIVE --format='value(account)')

  # This step generates the new manifest
  - name: 'gcr.io/cloud-builders/gcloud'
    id: Generate manifest
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
        sed "s/GOOGLE_CLOUD_PROJECT/${PROJECT_ID}/g" kubernetes.tpl.yaml | \
        sed "s/COMMIT_SHA/${SHORT_SHA}/g" > dev-server-env/kubernetes.yaml

  # This step pushes the manifest back to hello-cloudbuild-env
  - name: 'gcr.io/cloud-builders/gcloud'
    id: Push manifest
    entrypoint: /bin/sh
    args:
      - '-c'
      - |
        set -x && \
        cd dev-server-env && \
        git add kubernetes.yaml && \
        git commit -m "Deploying image eu.gcr.io/${PROJECT_ID}/dev-praxis-website-nuxtapp:${SHORT_SHA}
        Built from commit ${COMMIT_SHA} of repository dev-praxis-website-nuxtapp
        Author: $(git log --format='%an <%ae>' -n 1 HEAD)" && \
        git push origin candidate

availableSecrets:
  secretManager:
    - versionName: projects/823625160285/secrets/onehive-dms-security-token/versions/latest
      env: ONE_HIVE_DMS_SECURITY_TOKEN


# [END cloudbuild-trigger-cd]
timeout: 2000s
images: ['eu.gcr.io/$PROJECT_ID/dev-praxis-website-nuxtapp:$SHORT_SHA']
