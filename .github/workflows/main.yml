# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  # push:
  #   branches: [ master ]
  # pull_request:
  #   branches: [ master ]
  [push, pull_request]
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  lighthouseci:
    runs-on: ubuntu-latest
    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}
      LIGHTHOUSE_UPLOAD_USER: ${{ secrets.LIGHTHOUSE_UPLOAD_USER }}
      LIGHTHOUSE_UPLOAD_USER_PASSWORD: ${{ secrets.LIGHTHOUSE_UPLOAD_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
      - run: npm install && npm install -g @lhci/cli@0.4.x
      - name: Run ESLint
        run: npm run lint
      # - name: Generate Static Webpage
      #   run: npm run generate
      # - name: Run Lighthouse
      #   run: lhci autorun --upload.basicAuth.username=$LIGHTHOUSE_UPLOAD_USER --upload.basicAuth.password=$LIGHTHOUSE_UPLOAD_USER_PASSWORD