apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-praxis-website-nuxtapp-deployment
  labels:
    app: dev-praxis-website-nuxtapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-praxis-website-nuxtapp
  template: # create pods using pod definition in this template
    metadata:
      # unlike pod-nginx.yaml, the name is not included in the meta data as a unique name is
      # generated from the deployment name
      labels:
        app: dev-praxis-website-nuxtapp
    spec:
      containers:
        - name: dev-praxis-website-nuxtapp
          image: eu.gcr.io/GOOGLE_CLOUD_PROJECT/dev-praxis-website-nuxtapp:COMMIT_SHA
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: dev-praxis-website-nuxtapp-service
spec:
  type: NodePort
  ports:
    - name: httpdevpraxiswebsitenuxtapp
      port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 30062
  selector:
    app: dev-praxis-website-nuxtapp
