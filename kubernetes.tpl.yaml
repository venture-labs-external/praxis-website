apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-payfree-webapp-deployment
  labels:
    app: payfree-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payfree-webapp
  template: # create pods using pod definition in this template
    metadata:
      # unlike pod-nginx.yaml, the name is not included in the meta data as a unique name is
      # generated from the deployment name
      labels:
        app: payfree-webapp
    spec:
      containers:
      - name: payfree-webapp
        image: gcr.io/GOOGLE_CLOUD_PROJECT/payfree-webapp:COMMIT_SHA
        ports:
        - containerPort: 80
        # env:
        # - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
        #   value: "http://dev-payfree.de/auth/realms/payfree"
        # readinessProbe:
        #   httpGet:
        #     path: /api/actuator/health
        #     port: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: dev-payfree-webapp-service
spec:
  type: NodePort
  ports:
  - name: httpwebapp
    port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 32002
  selector:
    app: payfree-webapp

